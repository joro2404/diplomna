[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-lab"
version = "0.1.0"
description = "Strategy backtesting for multi-asset research"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "yfinance>=0.2.40",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
trading-lab = "trading_lab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_lab*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
